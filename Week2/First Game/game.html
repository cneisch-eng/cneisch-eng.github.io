<!DOCTYPE html>
<html>
    <head>
        <title>My Top choices for Pokemon</title>
    </head>

    <body class="battle" style="background-color: orange">
        <h1 id="Ampharos">A WILD AMPHAROS APPEARS</h1>
        <section class="Ampharos">
            <img src="./Assets/Amph Front.png"></img>
            <h3>50/50 Hp</h3>
        </section>
        <div style="background-color: green;"><p>&nbsp;</p></div>
        <section class="Squirtle">
            <img src="./Assets/Squirtle Back.png"></img>
            <ol>
                <li><button>FIGHT</button></li>
                <li><label id="item" for="item-select"><button>ITEM</Button></label>
                
                    <select id="item-select">
                        <option value="potion">Potion</option>
                        <option value="berries">Berry</option>
                        <option value="pokeball">Pokeball</option>
                    </select>
                </li>
                <li><label id="switch" for="switch-select"><button>SWITCH</button></label>
                
                    <select id="switch-select">
                        <option value="Wurmple">Wurmple</option>
                        <option value="Oshawott">Oshawott</option>

                    </select>
                
                </li>
                <li><button>RUN</button></li>
            </ol>
        </section>
    </body>

    

</html>
